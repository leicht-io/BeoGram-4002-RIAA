<title id="t">Simulated RIAA response of the BeoGram 4002 RIAA board</title>
<desc id="d">Top: v3 response relative to 1 kHz, from +19 dB at 20 Hz to -20 dB at 20 kHz. Bottom: deviation from the RIAA curve, within 0.1 dB from 50 Hz to 20 kHz for v3; v2 rises to +0.7 dB at 10 to 20 kHz.</desc>
